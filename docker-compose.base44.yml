services:
  web:
    image: node:24-slim
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
      - /app/.git
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS=${BASE44_PUBLIC_HOST_SUFFIX}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev"
    restart: unless-stopped
