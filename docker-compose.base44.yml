services:
  # One-shot: creates an anonymous Convex deployment and writes
  # NEXT_PUBLIC_CONVEX_URL + CONVEX_DEPLOYMENT to .env.local.
  convex-setup:
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - CONVEX_AGENT_MODE=anonymous
    command: sh -c "corepack enable && pnpm install && pnpm exec convex dev --once"
    restart: "no"

  web:
    image: node:24
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX}
    command: sh -c "corepack enable && pnpm install && pnpm dev -- -H 0.0.0.0"
    depends_on:
      convex-setup:
        condition: service_completed_successfully
